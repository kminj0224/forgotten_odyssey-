name: Recover editable APK workspace
on:
  push:
    branches: ['recovery/apk-source-workspace']
    paths: ['.github/workflows/recover.yml', 'tools/recover.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover resources and Android code
        run: |
          if [ ! -d apk ]; then python tools/recover.py; fi
          python tools/verify_recovery.py
      - name: Recover native pseudocode
        run: |
          curl -fL --retry 3 https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_10.4_build/ghidra_10.4_PUBLIC_20230928.zip -o .tmp/ghidra.zip
          unzip -q .tmp/ghidra.zip -d .tools
          mkdir -p .tmp/ghidra-project
          for lib in apk/lib/armeabi-v7a/*.so; do
            .tools/ghidra_10.4_PUBLIC/support/analyzeHeadless .tmp/ghidra-project Odyssey \
              -import "$lib" -analysisTimeoutPerFile 180 -max-cpu 4 \
              -scriptPath tools/ghidra -postScript ExportRecovered.java "$PWD/recovered-native"
          done
      - name: Build and verify APK
        run: |
          python tools/build.py
          python tools/verify_recovery.py --apk dist/signed/forgotten-odyssey-aligned-debugSigned.apk
      - name: Commit recovered files to working branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apk recovered-java recovered-native reports
          if ! git diff --cached --quiet; then
            git commit -m 'Recover assets, Android code and native pseudocode from v4 APK'
            git push origin HEAD:recovery/apk-source-workspace
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: forgotten-odyssey-debug-apk
          path: dist/signed/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: forgotten-odyssey-recovered-project
          path: |
            apk/
            recovered-java/
            recovered-native/
            reports/
            tools/
            docs/
            README.md
            SOURCE_RECOVERY.md
